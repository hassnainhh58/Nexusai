name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t nexusai-backend:latest .

      - name: Verify the Docker image serves health checks
        run: |
          docker run --rm -d --name nexusai-backend -p 8000:8000 \
            -e LLM_API_KEY=test-key \
            -e CLERK_JWT_ISSUER=https://example.clerk.accounts.dev \
            nexusai-backend:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              echo "\nBackend container is healthy."
              break
            fi
            sleep 2
          done
          docker logs nexusai-backend
          curl -fsS http://127.0.0.1:8000/health/ready > /dev/null
          docker stop nexusai-backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (oxlint)
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_placeholder \
            -t nexusai-frontend:latest .
